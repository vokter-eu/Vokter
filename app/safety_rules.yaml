# Vokter safety rules — the machine-readable teeth behind CONSTITUTION.md.
# The gateway (safety.py) reads THIS; CONSTITUTION.md is the human-readable mirror.
# Keep them in lockstep. See safety.py for how each verdict is enforced.
#
# Per action, a verdict for `human` (the owner, via the local UI) and `nonhuman`
# (peers over A2A/Nostr, the MCP server, autonomous planner/scheduler):
#   allow                — permit
#   block                — refuse always
#   confirm              — permit only after explicit human approval; in ANY
#                          non-human context confirm COLLAPSES TO BLOCK
#   allow_if_allowlisted — permit only if `target` passes the browse allowlist
#   allow_if_known       — permit only if `target` peer is an already-known agent
version: 1

# Deny-by-default: an action with no rule below (or an unknown action id) uses this.
default:
  human: confirm
  nonhuman: block

rules:
  # Read-only web fetch — the allowlist/SSRF check is the target predicate.
  browse:
    human: allow_if_allowlisted
    nonhuman: allow_if_allowlisted
  # Tier-3 Phase 1: ACTING on a web page in the interactive browser (fill/submit/click).
  # CONFIRM-human-only — collapses to BLOCK for peer/mcp/autonomous, so a hostile page or a
  # peer can never drive a form. Read-only navigation stays under `browse` (lighter). The
  # browser runs hostile page JS, contained per TIER3_PHASE1_BROWSER_CONTAINMENT.md; NO secrets
  # (password/PAN/CVV/OTP) this phase — those are later, each behind their own gate.
  web.act:         { human: confirm, nonhuman: block }
  # Tier-3 Phase 1: LOGGING IN to a site on the human's behalf (web_login routine). CONFIRM-human-only
  # — collapses to BLOCK for peer/mcp/autonomous, so a page or a peer can never drive a login. Distinct
  # from web.act: the request carries only a (site, identity) REFERENCE, never a secret value; the
  # password/token is dereferenced by code and typed by the injector into a page whose RESOLVED origin
  # was verified — the model only learns succeeded|failed. See TIER3_PHASE1_LOGIN.md. No secret path
  # executes until the fire-test secret-non-leakage probe is green on the frozen .deb.
  web.login:       { human: confirm, nonhuman: block }
  # Tier-3 Phase 2: PAYING on the human's behalf (web_pay routine). CONFIRM-human-only — collapses to
  # BLOCK for peer/mcp/autonomous, so a page or a peer can never trigger a payment. Crypto-first: Vokter
  # NEVER holds funds or keys — it constructs a payment request (LNURL/Lightning-Address) and hands off
  # to the user's OWN wallet, which confirms+signs. Per-payment human-confirm is MANDATORY (crypto is
  # irreversible). Origin-bound: the payee domain must match the resolved merchant origin, or the sheet
  # flags the destination as unverifiable. Gateway ceilings (per-tx/window/payee) are a second limit.
  # See TIER3_PHASE2_PAYMENTS.md. No payment runs until the TIER-6 fire-test is green on the frozen .deb.
  web.pay:         { human: confirm, nonhuman: block }
  # Tier-3 Phase 2B: AUTONOMOUS payment WITHIN A BUDGET (web_pay_unattended routine). OPT-IN, DEFAULT OFF,
  # its OWN gate (TIER-7). The ONLY action where a non-human caller may move money with no per-payment
  # confirm — and ONLY inside the user's upfront mandate. human: confirm (a human present confirms).
  # nonhuman: allow_if_within_mandate — ALLOW is granted ONLY when the handler passes a MandateGrant proving
  # the spend is in-envelope (allow-listed Lightning Address AND <= per-tx AND <= budget AND in-window AND
  # under throttle). peer/mcp never build that grant -> BLOCK (fail-closed). Opaque/on-chain never eligible.
  # The user's OWN wallet holds funds+key and enforces the cap (NIP-47); Vokter holds only a budget-limited,
  # revocable connection secret. See TIER3_PHASE2B_NWC_UNATTENDED.md. Dormant until the TIER-7 fire-test is
  # green on the frozen .deb.
  web.pay.unattended: { human: confirm, nonhuman: allow_if_within_mandate }
  # Outbound agent messages — channel-confined to peers we already know.
  dm.send:
    human: allow_if_known
    nonhuman: allow_if_known
  # Local, owner-only destructive actions — never reachable by a peer/MCP.
  doc.delete:      { human: confirm, nonhuman: block }
  memory.delete:   { human: confirm, nonhuman: block }
  memory.purge:    { human: confirm, nonhuman: block }
  task.delete:     { human: confirm, nonhuman: block }
  email.purge:     { human: confirm, nonhuman: block }
  avatar.delete:   { human: confirm, nonhuman: block }
  # Creating a recurring autonomous job — the MCP server exposes this, so a peer
  # MUST be blocked here even though the tool exists.
  schedule.create: { human: confirm, nonhuman: block }
