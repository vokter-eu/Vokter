<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokter — your guardian</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2d333b; --text:#e6edf3;
          --muted:#8b949e; --accent:#4cc38a; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif;
         max-width:760px; margin:0 auto; padding:16px; min-height:100vh;
         display:flex; flex-direction:column; }
  header { padding:8px 0 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.3rem; } h1 span{ color:var(--accent); }
  .tag { color:var(--muted); font-size:.85rem; }
  #email { padding:12px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #email-status { color:var(--muted); font-size:.85rem; }
  .btn-sm { padding:7px 12px; border-radius:8px; border:1px solid var(--line);
            background:transparent; color:var(--muted); font-size:.85rem; cursor:pointer; }
  .btn-sm:hover { border-color:var(--accent); color:var(--accent); }
  .btn-sm.danger:hover { border-color:#f85149; color:#f85149; }
  #docs { padding:12px 0; border-bottom:1px solid var(--line); }
  .doc { display:flex; justify-content:space-between; align-items:center;
         padding:6px 10px; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; margin-top:6px; font-size:.9rem; }
  .doc button { background:none; border:none; color:#f85149; cursor:pointer; font-size:1rem; }
  #chat { flex:1; overflow-y:auto; padding:16px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; margin-bottom:10px;
         white-space:pre-wrap; word-wrap:break-word; }
  .user { background:#1f6feb33; margin-left:auto; }
  .bot  { background:var(--panel); border:1px solid var(--line); }
  .src  { color:var(--muted); font-size:.75rem; margin-top:6px; }
  form { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .btn-new { padding:12px 16px; border-radius:10px; border:1px solid var(--line);
             background:transparent; color:var(--muted); font-size:.9rem; cursor:pointer; }
  .btn-new:hover { border-color:var(--accent); color:var(--accent); }
  input[type=text] { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
         background:var(--panel); color:var(--text); font-size:1rem; }
  .btn { padding:12px 16px; border-radius:10px; border:none; background:var(--accent);
         color:#06251a; font-weight:700; cursor:pointer; }
  .upload { display:inline-block; margin-top:8px; color:var(--accent); cursor:pointer;
            font-size:.9rem; }
  .upload input { display:none; }
</style>
</head>
<body>
<header>
  <h1>🛡️ Vokter <span>v0.1</span></h1>
  <div class="tag">Everything runs on your machine. Not a single byte leaves here.</div>
  <label class="upload">＋ Teach it a document (PDF, TXT, MD)
    <input type="file" id="file" accept=".pdf,.txt,.md">
  </label>
</header>

<div id="email">
  <span id="email-status">checking email…</span>
  <button class="btn-sm" id="btn-sync">⟳ Sync emails</button>
  <button class="btn-sm danger" id="btn-del-emails" style="display:none">✕ Delete all emails</button>
</div>
<div id="docs"></div>
<div id="chat">
  <div class="msg bot">I'm Vokter, your guardian. Upload a document and ask me anything about it. What I learn stays between you and me — literally: it lives on your disk.</div>
</div>

<form id="ask">
  <input type="text" id="q" placeholder="Ask your documents…" autocomplete="off">
  <button class="btn">→</button>
  <button type="button" class="btn-new" id="new-chat">New chat</button>
</form>

<script>
const chat = document.getElementById('chat');
const docsEl = document.getElementById('docs');
let conversationId = null;

function add(role, text, sources){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  if (sources && sources.length){
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = 'Sources: ' + sources.join(', ');
    d.appendChild(s);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function loadDocs(){
  const r = await fetch('/api/docs');
  const docs = await r.json();
  docsEl.innerHTML = docs.length ? '' :
    '<div class="tag">Vokter knows nothing yet. That\'s its most private state 😉</div>';
  for (const d of docs){
    const row = document.createElement('div');
    row.className = 'doc';
    row.innerHTML = `<span>📄 ${d.doc} <span class="tag">(${d.chunks} chunks)</span></span>`;
    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = 'Real deletion: document and embeddings';
    del.onclick = async () => {
      await fetch('/api/docs/' + encodeURIComponent(d.doc), {method:'DELETE'});
      loadDocs();
    };
    row.appendChild(del);
    docsEl.appendChild(row);
  }
}

document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const note = add('bot', `Reading and memorizing "${f.name}" locally…`);
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/api/docs', {method:'POST', body:fd});
  const j = await r.json();
  note.textContent = r.ok
    ? `Done. I've memorized "${j.doc}" in ${j.chunks} chunks, all on your disk.`
    : `I couldn't read that file: ${j.detail || 'error'}`;
  loadDocs();
  e.target.value = '';
};

document.getElementById('ask').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('q');
  const q = input.value.trim();
  if (!q) return;
  add('user', q);
  input.value = '';
  const thinking = add('bot', 'Thinking locally…');
  try {
    const r = await fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q, conversation_id: conversationId})
    });
    let j;
    try { j = await r.json(); } catch {
      thinking.textContent = `Server error ${r.status} — unexpected response format.`;
      return;
    }
    thinking.remove();
    if (r.ok) {
      conversationId = j.conversation_id;
      add('bot', j.answer, j.sources);
    } else {
      add('bot', j.detail || 'Error');
    }
  } catch (err){
    thinking.textContent = 'Can\'t reach Ollama. Is the container running?';
  }
};

document.getElementById('new-chat').onclick = () => {
  conversationId = null;
  chat.innerHTML = '';
  add('bot', 'New conversation started. Ask me anything about your documents.');
};

async function loadEmailStatus() {
  const r = await fetch('/api/email/status');
  const j = await r.json();
  const el = document.getElementById('email-status');
  const delBtn = document.getElementById('btn-del-emails');
  if (!j.configured) {
    el.textContent = 'Email not configured (set VOKTER_EMAIL_* in docker-compose.yml)';
  } else {
    el.textContent = j.synced_emails > 0
      ? `${j.synced_emails} emails in memory`
      : 'No emails synced yet';
    delBtn.style.display = j.synced_emails > 0 ? '' : 'none';
  }
}

document.getElementById('btn-sync').onclick = async () => {
  const btn = document.getElementById('btn-sync');
  const el  = document.getElementById('email-status');
  btn.disabled = true;
  el.textContent = 'Syncing… (this may take a while)';
  try {
    const r = await fetch('/api/email/sync', {method: 'POST'});
    const j = await r.json();
    if (r.ok) {
      el.textContent = `Done — ${j.synced} new emails added (${j.errors} errors)`;
      loadEmailStatus();
    } else {
      el.textContent = `Error: ${j.detail}`;
    }
  } catch {
    el.textContent = 'Could not reach server.';
  }
  btn.disabled = false;
};

document.getElementById('btn-del-emails').onclick = async () => {
  if (!confirm('Delete all synced emails from Vokter\'s memory?')) return;
  const r = await fetch('/api/email/all', {method: 'DELETE'});
  const j = await r.json();
  add('bot', `Deleted ${j.emails_removed} emails (${j.chunks_removed} chunks removed).`);
  loadEmailStatus();
};

loadDocs();
loadEmailStatus();
</script>
</body>
</html>
