<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vokter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 56'%3E%3Cpath d='M24 2.5 41.5 9.2V26.5C41.5 39.5 33.7 48.7 24 53.5 14.3 48.7 6.5 39.5 6.5 26.5V9.2Z' fill='none' stroke='%232D6A4F' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='27' r='4.2' fill='%232D6A4F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root{
    --green:#2D6A4F; --green-deep:#245C43; --tint:#E8EFE9; --amber:#E7A23C;
    --cream:#FBFAF6; --cream2:#F6F4EF; --sand:#E5E1D8; --ink:#171511; --ink-2:#3C3A34;
    --grey:#6E6B61; --grey2:#9A9689; --faint:#C9C4B8;
    --serif:'Fraunces',Georgia,serif; --body:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--body);background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;overscroll-behavior:none}
  button{font-family:inherit}
  #app{position:relative;height:100dvh;width:100%;max-width:480px;margin:0 auto;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:520px){#app{border-left:1px solid var(--sand);border-right:1px solid var(--sand)}}

  .hdr{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:calc(15px + env(safe-area-inset-top)) 20px 13px;border-bottom:1px solid var(--sand)}
  .hdr .mk{width:25px;height:29px;flex:0 0 auto}
  .hdr .t{flex:1;min-width:0}
  .hdr .t b{font-family:var(--serif);font-weight:600;font-size:19px;display:block;line-height:1.1}
  .hdr .t span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--green)}
  .icbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:5px;color:var(--grey);display:grid;place-items:center;transition:background .15s}
  .icbtn:hover{background:var(--tint)}
  .icbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .thread{flex:1 1 auto;overflow-y:auto;min-height:0;scroll-behavior:smooth}
  .msgs{display:flex;flex-direction:column;gap:10px;padding:18px 16px}
  .b{max-width:82%;padding:11px 15px;font-size:14.5px;line-height:1.55;word-wrap:break-word;animation:rise .26s ease both}
  .b.me{align-self:flex-end;background:var(--green);color:var(--cream);border-radius:9px 9px 2px 9px;line-height:1.45}
  .b.them{align-self:flex-start;background:var(--cream2);color:var(--ink);border:1px solid var(--sand);border-radius:9px 9px 9px 2px}
  .b.file{align-self:flex-end;display:flex;align-items:center;gap:9px;background:var(--cream);border:1px solid var(--sand);border-radius:6px;padding:9px 12px;max-width:82%}
  .b.file .fn{font-size:13px;font-weight:600;line-height:1.2}
  .b.file .fs{font-family:var(--mono);font-size:10.5px;color:var(--grey2);margin-top:2px}
  .them .sources{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .them .src{font-family:var(--mono);font-size:10.5px;color:var(--green);background:var(--cream);border:1px solid var(--sand);border-radius:3px;padding:3px 7px}
  .them .say{margin-top:8px;background:none;border:none;cursor:pointer;color:var(--grey);display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:0;letter-spacing:.04em}
  .them .say:hover{color:var(--green)}
  .typing{display:inline-flex;gap:4px;align-items:center}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 34px}
  .empty .badge{width:72px;height:72px;border-radius:8px;background:var(--tint);display:grid;place-items:center;margin-bottom:24px}
  .empty h1{font-family:var(--serif);font-size:27px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}
  .empty p{color:var(--grey);font-size:14.5px;line-height:1.55;max-width:28ch}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .chip{cursor:pointer;background:var(--cream);border:1px solid var(--sand);border-radius:3px;padding:10px 16px;font-size:13.5px;color:var(--ink);font-weight:500;transition:border-color .15s}
  .chip:hover{border-color:var(--green)}
  .chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .composer{flex:0 0 auto;padding:8px 14px calc(16px + env(safe-area-inset-bottom))}
  .inrow{display:flex;align-items:center;gap:8px;background:var(--cream2);border:1px solid var(--sand);border-radius:6px;padding:7px 7px 7px 14px}
  .inrow:focus-within{border-color:var(--green)}
  .inrow input[type=text]{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:15px;color:var(--ink);min-width:0}
  .inrow input::placeholder{color:var(--grey2)}
  .rnd{cursor:pointer;border:none;display:grid;place-items:center;flex:0 0 auto}
  .rnd.mic{width:36px;height:36px;border-radius:4px;background:var(--tint)}
  .rnd.send{width:40px;height:40px;border-radius:4px;background:var(--green)}
  .rnd.plain{background:none;padding:2px}
  .rnd:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .view{position:absolute;inset:0;display:none;flex-direction:column;z-index:10}
  .view.on{display:flex}

  #voiceView{background:var(--green)}
  .vtop{display:flex;justify-content:flex-end;padding:calc(15px + env(safe-area-inset-top)) 22px 4px}
  .vmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
  .vhalo{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:38px}
  .vhalo .ring{position:absolute;inset:0;border-radius:50%;background:rgba(251,250,246,.16);animation:halo 2.4s infinite}
  .vwave{width:104px;height:104px;border-radius:6px;background:var(--cream);display:flex;align-items:center;justify-content:center;gap:5px}
  .vwave span{width:6px;height:38px;background:var(--green);border-radius:3px;animation:bar .9s infinite}
  .vwave span:nth-child(3){background:var(--amber)}
  .vwave span:nth-child(2){animation-delay:.15s}.vwave span:nth-child(3){animation-delay:.3s}
  .vwave span:nth-child(4){animation-delay:.45s}.vwave span:nth-child(5){animation-delay:.6s}
  #voiceView h2{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--cream);margin-bottom:10px}
  #voiceView p{color:rgba(251,250,246,.75);font-size:15px;line-height:1.55;max-width:26ch}
  .vbtns{display:flex;justify-content:center;gap:22px;align-items:center;padding:0 40px calc(46px + env(safe-area-inset-bottom))}
  .vbtn{cursor:pointer;border:none;border-radius:6px;display:grid;place-items:center}
  .vbtn.cancel{width:58px;height:58px;background:rgba(251,250,246,.14)}
  .vbtn.done{width:72px;height:72px;background:var(--cream)}
  @keyframes halo{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  @keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  #settingsView{background:var(--cream)}
  .stop{display:flex;align-items:center;gap:12px;padding:calc(15px + env(safe-area-inset-top)) 18px 16px 14px}
  .stop h2{font-family:var(--serif);font-weight:600;font-size:24px}
  .slist{flex:1;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
  .note{background:var(--tint);border-radius:6px;padding:13px 15px;font-size:13px;line-height:1.5;margin-bottom:10px}
  .srow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--sand);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
  .srow .ic{width:34px;height:34px;border-radius:4px;background:var(--tint);flex:0 0 auto;display:grid;place-items:center;color:var(--green)}
  .srow .lb{flex:1;font-weight:600;font-size:14.5px}
  .srow .rt{font-family:var(--mono);color:var(--grey2);font-size:11.5px}
  .srow.soon{opacity:.55;cursor:default}
  .srow.soon .ic{background:var(--cream2);color:var(--grey2)}
  .srow.soon .lb{color:var(--ink-2)}
  .srow .badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--grey2);background:var(--cream2);padding:4px 8px;border-radius:3px}
  .srow:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:4px}
  .subwrap{padding:6px 2px}
  .subwrap .drow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--sand)}
  .subwrap .drow .dn{flex:1;font-size:14px;font-weight:500}
  .subwrap .drow .dc{font-family:var(--mono);font-size:11px;color:var(--grey2)}
  .subwrap .drow .del{background:none;border:none;cursor:pointer;color:var(--grey);padding:4px 6px;border-radius:4px;font-size:15px}
  .subwrap .drow .del:hover{background:var(--tint);color:var(--green)}
  .subwrap .placeholder{color:var(--grey);font-size:14px;line-height:1.6;padding:14px 4px}
  .langrow{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--sand);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:15px;font-weight:500}
  .langrow .tick{margin-left:auto;color:var(--green)}
  .langrow:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:4px}

  /* Settings sub-view form controls — shared by the Email/Web/Tasks/Model panels */
  .subwrap .sfield{display:flex;flex-direction:column;gap:6px;margin:12px 0}
  .subwrap .sfield label{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--grey)}
  .subwrap .sin{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--cream2);border:1px solid var(--sand);border-radius:6px;padding:10px 12px;outline:none}
  .subwrap select.sin{appearance:none;-webkit-appearance:none;cursor:pointer}
  .subwrap .sin:focus{border-color:var(--green)}
  .subwrap .sin:focus-visible{outline:2px solid var(--green);outline-offset:1px}
  .subwrap .sbtn{cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;border-radius:5px;padding:10px 16px;border:1px solid var(--green);background:var(--green);color:var(--cream);transition:background .15s}
  .subwrap .sbtn:hover{background:var(--green-deep)}
  .subwrap .sbtn.ghost{background:none;color:var(--green)}
  .subwrap .sbtn.ghost:hover{background:var(--tint)}
  .subwrap .sbtn.mini{padding:5px 11px;font-size:11.5px;border-radius:4px}
  .subwrap .sbtn:disabled{opacity:.5;cursor:default}
  .subwrap .sbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .subwrap .sactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
  .subwrap .saddrow{display:flex;gap:8px;margin:12px 0}
  .subwrap .saddrow .sin{flex:1}
  .subwrap .smeta{font-family:var(--mono);font-size:11.5px;color:var(--grey2);line-height:1.6;padding:6px 4px}
  .subwrap .drow .dc.on{color:var(--green)}
  .subwrap .drow .acts{display:flex;gap:6px;align-items:center;margin-left:auto}

  .toast{position:absolute;left:50%;bottom:98px;transform:translate(-50%,10px);background:var(--ink);color:var(--tint);font-size:13px;padding:9px 15px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:80%;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <svg class="mk" viewBox="0 0 48 56" fill="none"><path d="M24 2.5 41.5 9.2V26.5C41.5 39.5 33.7 48.7 24 53.5 14.3 48.7 6.5 39.5 6.5 26.5V9.2Z" fill="none" stroke="#2D6A4F" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="27" r="4.2" fill="#2D6A4F"/></svg>
    <div class="t"><b>Vokter</b><span data-i18n="onDevice">On your device</span></div>
    <button class="icbtn" id="openSettings" data-i18n-aria="settings" aria-label="Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <div class="badge"><svg width="36" height="42" viewBox="0 0 48 56" fill="none"><path d="M24 2.5 41.5 9.2V26.5C41.5 39.5 33.7 48.7 24 53.5 14.3 48.7 6.5 39.5 6.5 26.5V9.2Z" fill="none" stroke="#2D6A4F" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="27" r="4.2" fill="#2D6A4F"/></svg></div>
      <h1 data-i18n="emptyTitle">Hello. I'm yours.</h1>
      <p data-i18n="emptyBody">Only you and your agent are here. Nothing leaves this machine.</p>
      <div class="chips">
        <button class="chip" id="chipDoc" data-i18n="chipDoc">Read a document with me</button>
        <button class="chip" id="chipWhat" data-i18n="chipWhat">What can you do?</button>
      </div>
    </div>
    <div class="msgs" id="msgs" style="display:none"></div>
  </div>

  <div class="composer">
    <div class="inrow">
      <button class="rnd plain" id="attachBtn" data-i18n-aria="addDoc" aria-label="Add a document">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m8 13 4 4a5 5 0 0 0 7-7l-7-7a3.5 3.5 0 0 0-5 5l7 7a2 2 0 0 0 3-3l-6-6" stroke="#6E6B61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.md,.docx,.csv">
      <input type="text" id="q" data-i18n-ph="placeholder" placeholder="Message your agent…" autocomplete="off">
      <button class="rnd mic" id="micBtn" data-i18n-aria="speak" aria-label="Speak">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3" stroke="#2D6A4F" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="#2D6A4F" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="rnd send" id="sendBtn" data-i18n-aria="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="#F6F4EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="view" id="voiceView">
    <div class="vtop"><button class="icbtn" style="color:#FBFAF6" id="voiceX" aria-label="Cancel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M6 18 18 6" stroke="#FBFAF6" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="vmid">
      <div class="vhalo"><span class="ring"></span><div class="vwave"><span></span><span></span><span></span><span></span><span></span></div></div>
      <h2 data-i18n="listening">Listening…</h2>
      <p data-i18n="listeningBody">Take your time. I'm hearing you on this device only.</p>
    </div>
    <div class="vbtns">
      <button class="vbtn cancel" id="voiceCancel" aria-label="Cancel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M6 18 18 6" stroke="#FBFAF6" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="vbtn done" id="voiceDone" aria-label="Done"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#2D6A4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div class="view" id="settingsView">
    <div class="stop">
      <button class="icbtn" id="settingsBack" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#171511" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="settingsTitle">Settings</h2>
    </div>
    <div class="slist" id="slist"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
