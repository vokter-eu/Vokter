<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokter — tu guardián</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2d333b; --text:#e6edf3;
          --muted:#8b949e; --accent:#4cc38a; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif;
         max-width:760px; margin:0 auto; padding:16px; min-height:100vh;
         display:flex; flex-direction:column; }
  header { padding:8px 0 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.3rem; } h1 span{ color:var(--accent); }
  .tag { color:var(--muted); font-size:.85rem; }
  #docs { padding:12px 0; border-bottom:1px solid var(--line); }
  .doc { display:flex; justify-content:space-between; align-items:center;
         padding:6px 10px; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; margin-top:6px; font-size:.9rem; }
  .doc button { background:none; border:none; color:#f85149; cursor:pointer; font-size:1rem; }
  #chat { flex:1; overflow-y:auto; padding:16px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; margin-bottom:10px;
         white-space:pre-wrap; word-wrap:break-word; }
  .user { background:#1f6feb33; margin-left:auto; }
  .bot  { background:var(--panel); border:1px solid var(--line); }
  .src  { color:var(--muted); font-size:.75rem; margin-top:6px; }
  form { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
         background:var(--panel); color:var(--text); font-size:1rem; }
  .btn { padding:12px 16px; border-radius:10px; border:none; background:var(--accent);
         color:#06251a; font-weight:700; cursor:pointer; }
  .upload { display:inline-block; margin-top:8px; color:var(--accent); cursor:pointer;
            font-size:.9rem; }
  .upload input { display:none; }
</style>
</head>
<body>
<header>
  <h1>🛡️ Vokter <span>v0.1</span></h1>
  <div class="tag">Todo corre en tu máquina. Ni un byte sale de aquí.</div>
  <label class="upload">＋ Enséñale un documento (PDF, TXT, MD)
    <input type="file" id="file" accept=".pdf,.txt,.md">
  </label>
</header>

<div id="docs"></div>
<div id="chat">
  <div class="msg bot">Soy Vokter, tu guardián. Súbeme un documento y pregúntame lo que quieras sobre él. Lo que aprenda se queda entre tú y yo — literalmente: vive en tu disco.</div>
</div>

<form id="ask">
  <input type="text" id="q" placeholder="Pregúntale a tus documentos…" autocomplete="off">
  <button class="btn">→</button>
</form>

<script>
const chat = document.getElementById('chat');
const docsEl = document.getElementById('docs');

function add(role, text, sources){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  if (sources && sources.length){
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = 'Fuentes: ' + sources.join(', ');
    d.appendChild(s);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function loadDocs(){
  const r = await fetch('/api/docs');
  const docs = await r.json();
  docsEl.innerHTML = docs.length ? '' :
    '<div class="tag">Vokter aún no sabe nada. Ese es su estado más privado 😉</div>';
  for (const d of docs){
    const row = document.createElement('div');
    row.className = 'doc';
    row.innerHTML = `<span>📄 ${d.doc} <span class="tag">(${d.chunks} fragmentos)</span></span>`;
    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = 'Borrado real: documento y embeddings';
    del.onclick = async () => {
      await fetch('/api/docs/' + encodeURIComponent(d.doc), {method:'DELETE'});
      loadDocs();
    };
    row.appendChild(del);
    docsEl.appendChild(row);
  }
}

document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const note = add('bot', `Leyendo y memorizando «${f.name}» en local…`);
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/api/docs', {method:'POST', body:fd});
  const j = await r.json();
  note.textContent = r.ok
    ? `Listo. He memorizado «${j.doc}» en ${j.chunks} fragmentos, todos en tu disco.`
    : `No he podido leer ese archivo: ${j.detail || 'error'}`;
  loadDocs();
  e.target.value = '';
};

document.getElementById('ask').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('q');
  const q = input.value.trim();
  if (!q) return;
  add('user', q);
  input.value = '';
  const thinking = add('bot', 'Pensando en local…');
  try {
    const r = await fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q})
    });
    const j = await r.json();
    thinking.remove();
    add('bot', r.ok ? j.answer : (j.detail || 'Error'), j.sources);
  } catch (err){
    thinking.textContent = 'No llego a Ollama. ¿Está levantado el contenedor?';
  }
};

loadDocs();
</script>
</body>
</html>
