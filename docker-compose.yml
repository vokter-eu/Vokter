# Vokter — sovereign local AI agent
#
# Quick start:
#   cp .env.example .env          # then edit .env with your passphrase
#   docker compose up -d
#   docker exec -it vokter-ollama ollama pull llama3.2:3b
#   docker exec -it vokter-ollama ollama pull nomic-embed-text
#   open http://localhost:8080
#
# Hardware guide:
#   8 GB  RAM → llama3.2:3b or qwen2.5:3b
#   16 GB RAM → mistral or llama3.1:8b
#   NVIDIA GPU → uncomment the "deploy" block below

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vokter-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - vokter_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # --- GPU acceleration (NVIDIA): uncomment if you have a card ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  vokter:
    build: ./app
    container_name: vokter-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vokter_data:/data
    environment:
      # Internal service URL — do not change
      - VOKTER_OLLAMA_URL=http://ollama:11434
      # Models (must be pulled via 'ollama pull' before first use)
      - VOKTER_CHAT_MODEL=${VOKTER_CHAT_MODEL:-llama3.2:3b}
      - VOKTER_EMBED_MODEL=${VOKTER_EMBED_MODEL:-nomic-embed-text}
      # Database encryption key — CHANGE THIS before first run
      - VOKTER_DB_KEY=${VOKTER_DB_KEY:-change-me-before-first-run}
      # Email connector (IMAP) — leave blank to disable
      - VOKTER_EMAIL_IMAP_HOST=${VOKTER_EMAIL_IMAP_HOST:-}
      - VOKTER_EMAIL_IMAP_PORT=${VOKTER_EMAIL_IMAP_PORT:-993}
      - VOKTER_EMAIL_USER=${VOKTER_EMAIL_USER:-}
      - VOKTER_EMAIL_PASSWORD=${VOKTER_EMAIL_PASSWORD:-}
      - VOKTER_EMAIL_FOLDER=${VOKTER_EMAIL_FOLDER:-INBOX}
      - VOKTER_EMAIL_MAX_SYNC=${VOKTER_EMAIL_MAX_SYNC:-200}
      # Voice — models download automatically on first use
      # Whisper sizes: tiny | base | small | medium | large-v3
      - VOKTER_WHISPER_MODEL=${VOKTER_WHISPER_MODEL:-base}
      - VOKTER_WHISPER_DEVICE=${VOKTER_WHISPER_DEVICE:-cpu}
      # Piper voice — see https://huggingface.co/rhasspy/piper-voices
      - VOKTER_PIPER_VOICE=${VOKTER_PIPER_VOICE:-en_US-lessac-medium}
      # Wallet adapter:
      #   cashu       — Cashu e-cash, privacy layer (default)
      #   lightning   — Bitcoin Lightning via LNbits
      #   eurc|eure|eurcv|evm — MiCA stablecoins on EVM (Ethereum, Polygon, Base…)
      #   eurc-solana|eure-solana|sol — Solana tokens
      #   monero      — Monero (XMR)
      #   bitcoin     — Bitcoin on-chain
      - VOKTER_WALLET_ADAPTER=${VOKTER_WALLET_ADAPTER:-cashu}
      - VOKTER_WALLET_SPEND_LIMIT=${VOKTER_WALLET_SPEND_LIMIT:-0}
      # Cashu — point to any Cashu mint (self-hosted: github.com/cashubtc/nutshell)
      - VOKTER_CASHU_MINT_URL=${VOKTER_CASHU_MINT_URL:-}
      # Lightning (LNbits — self-hosted only)
      - VOKTER_LNBITS_URL=${VOKTER_LNBITS_URL:-}
      - VOKTER_LNBITS_INVOICE_KEY=${VOKTER_LNBITS_INVOICE_KEY:-}
      - VOKTER_LNBITS_ADMIN_KEY=${VOKTER_LNBITS_ADMIN_KEY:-}
      # EVM (any chain: Ethereum, Polygon, Base, Gnosis, Avalanche…)
      - VOKTER_EVM_RPC_URL=${VOKTER_EVM_RPC_URL:-}
      - VOKTER_EVM_PRIVATE_KEY=${VOKTER_EVM_PRIVATE_KEY:-}
      - VOKTER_EVM_TOKEN_CONTRACT=${VOKTER_EVM_TOKEN_CONTRACT:-}
      - VOKTER_EVM_TOKEN_SYMBOL=${VOKTER_EVM_TOKEN_SYMBOL:-}
      - VOKTER_EVM_TOKEN_DECIMALS=${VOKTER_EVM_TOKEN_DECIMALS:-18}
      - VOKTER_EVM_CHAIN=${VOKTER_EVM_CHAIN:-ethereum}
      # Solana
      - VOKTER_SOLANA_RPC_URL=${VOKTER_SOLANA_RPC_URL:-}
      - VOKTER_SOLANA_PRIVATE_KEY=${VOKTER_SOLANA_PRIVATE_KEY:-}
      - VOKTER_SOLANA_TOKEN_MINT=${VOKTER_SOLANA_TOKEN_MINT:-}
      - VOKTER_SOLANA_TOKEN_SYMBOL=${VOKTER_SOLANA_TOKEN_SYMBOL:-}
      # Monero (requires monero-wallet-rpc running alongside)
      - VOKTER_MONERO_RPC_URL=${VOKTER_MONERO_RPC_URL:-}
      # Bitcoin (requires Bitcoin Core or Electrum daemon)
      - VOKTER_BTC_RPC_URL=${VOKTER_BTC_RPC_URL:-}
      - VOKTER_BTC_RPC_USER=${VOKTER_BTC_RPC_USER:-}
      - VOKTER_BTC_RPC_PASS=${VOKTER_BTC_RPC_PASS:-}
    depends_on:
      - ollama

volumes:
  vokter_models:
  vokter_data:
