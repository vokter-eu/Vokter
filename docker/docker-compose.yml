# Vokter — Fase 1 (preliminar)
# Levanta el motor de IA local. Ni un byte sale de tu máquina.
#
# Uso:
#   docker compose up -d
#   docker exec -it vokter-ollama ollama pull llama3.1:8b
#   docker exec -it vokter-ollama ollama run llama3.1:8b
#
# Hardware orientativo:
#   8 GB RAM  -> llama3.2:3b o qwen2.5:3b
#   16 GB RAM -> llama3.1:8b o mistral
#   GPU NVIDIA -> descomenta el bloque "deploy" para acelerar

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vokter-ollama
    restart: unless-stopped
    ports:
      # Solo accesible desde TU máquina. No expongas esto a internet.
      - "127.0.0.1:11434:11434"
    volumes:
      - vokter_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # --- Aceleración GPU (NVIDIA): descomenta si tienes tarjeta ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # La interfaz y el cerebro de Vokter: ingesta de documentos, RAG y chat.
  vokter:
    build: ../app
    container_name: vokter-app
    restart: unless-stopped
    ports:
      # Solo accesible desde TU máquina.
      - "127.0.0.1:8080:8080"
    volumes:
      - vokter_data:/data
    environment:
      - VOKTER_OLLAMA_URL=http://ollama:11434
      - VOKTER_CHAT_MODEL=llama3.1:8b
      - VOKTER_EMBED_MODEL=nomic-embed-text
    depends_on:
      - ollama

volumes:
  vokter_models:
  vokter_data:
