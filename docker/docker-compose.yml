# Vokter — Phase 1 (preliminary)
# Spins up the local AI engine. Not a byte leaves your machine.
#
# Uso:
#   docker compose up -d
#   docker exec -it vokter-ollama ollama pull llama3.2:3b
#   docker exec -it vokter-ollama ollama run llama3.2:3b
#
# Rough hardware guide:
#   8 GB RAM  -> llama3.2:3b or qwen2.5:3b
#   16 GB RAM -> llama3.2:3b o mistral
#   NVIDIA GPU -> uncomment the "deploy" block to accelerate

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vokter-ollama
    restart: unless-stopped
    ports:
      # Only accessible from YOUR machine. Do not expose this to the internet.
      - "127.0.0.1:11434:11434"
    volumes:
      - vokter_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # --- GPU acceleration (NVIDIA): uncomment if you have a card ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Vokter's interface and brain: document ingestion, RAG, and chat.
  vokter:
    build: ../app
    container_name: vokter-app
    restart: unless-stopped
    ports:
      # Only accessible from YOUR machine.
      - "127.0.0.1:8080:8080"
    volumes:
      - vokter_data:/data
    environment:
      - VOKTER_OLLAMA_URL=http://ollama:11434
      - VOKTER_CHAT_MODEL=llama3.2:3b
      - VOKTER_EMBED_MODEL=nomic-embed-text
      # At-rest encryption for your local database.
      # Change this to a strong, unique passphrase before first run.
      # If upgrading from v0.1, re-ingest your documents after changing this.
      - VOKTER_DB_KEY=change-me-before-first-run
      # Email connector (IMAP). Fill in to let Vokter search your emails locally.
      # Use an app password, not your real password (Gmail: myaccount.google.com/apppasswords)
      # Leave blank to disable.
      - VOKTER_EMAIL_IMAP_HOST=
      - VOKTER_EMAIL_IMAP_PORT=993
      - VOKTER_EMAIL_USER=
      - VOKTER_EMAIL_PASSWORD=
      - VOKTER_EMAIL_FOLDER=INBOX
      - VOKTER_EMAIL_MAX_SYNC=200
      # Voice (Whisper STT + Piper TTS). Models download automatically on first use.
      # Whisper model sizes: tiny, base, small, medium, large-v3 (larger = slower + more accurate)
      - VOKTER_WHISPER_MODEL=base
      - VOKTER_WHISPER_DEVICE=cpu
      # Piper voice: see https://huggingface.co/rhasspy/piper-voices for available voices
      - VOKTER_PIPER_VOICE=en_US-lessac-medium
    depends_on:
      - ollama

volumes:
  vokter_models:
  vokter_data:
