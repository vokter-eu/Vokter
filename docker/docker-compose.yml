# Vokter — Phase 3
# Spins up the local AI engine. Not a byte leaves your machine.
#
# Uso:
#   docker compose up -d
#   docker exec -it vokter-ollama ollama pull llama3.2:3b
#   docker exec -it vokter-ollama ollama run llama3.2:3b
#
# Rough hardware guide:
#   8 GB RAM  -> llama3.2:3b or qwen2.5:3b
#   16 GB RAM -> llama3.2:3b o mistral
#   NVIDIA GPU -> uncomment the "deploy" block to accelerate

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vokter-ollama
    restart: unless-stopped
    ports:
      # Only accessible from YOUR machine. Do not expose this to the internet.
      - "127.0.0.1:11434:11434"
    volumes:
      - vokter_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # --- GPU acceleration (NVIDIA): uncomment if you have a card ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Vokter's interface and brain: document ingestion, RAG, and chat.
  vokter:
    build: ../app
    container_name: vokter-app
    restart: unless-stopped
    ports:
      # Only accessible from YOUR machine.
      - "127.0.0.1:8080:8080"
    volumes:
      - vokter_data:/data
    environment:
      - VOKTER_OLLAMA_URL=http://ollama:11434
      - VOKTER_CHAT_MODEL=llama3.2:3b
      - VOKTER_EMBED_MODEL=nomic-embed-text
      # At-rest encryption for your local database.
      # Change this to a strong, unique passphrase before first run.
      # If upgrading from v0.1, re-ingest your documents after changing this.
      - VOKTER_DB_KEY=change-me-before-first-run
      # Email connector (IMAP). Fill in to let Vokter search your emails locally.
      # Use an app password, not your real password (Gmail: myaccount.google.com/apppasswords)
      # Leave blank to disable.
      - VOKTER_EMAIL_IMAP_HOST=
      - VOKTER_EMAIL_IMAP_PORT=993
      - VOKTER_EMAIL_USER=
      - VOKTER_EMAIL_PASSWORD=
      - VOKTER_EMAIL_FOLDER=INBOX
      - VOKTER_EMAIL_MAX_SYNC=200
      # Voice (Whisper STT + Piper TTS). Models download automatically on first use.
      # Whisper model sizes: tiny, base, small, medium, large-v3 (larger = slower + more accurate)
      - VOKTER_WHISPER_MODEL=base
      - VOKTER_WHISPER_DEVICE=cpu
      # Piper voice: see https://huggingface.co/rhasspy/piper-voices for available voices
      - VOKTER_PIPER_VOICE=en_US-lessac-medium
      # ── Wallet (Phase 3) ─────────────────────────────────────────────────────
      # Adapter options:
      #   cashu                    Cashu e-cash, privacy layer (default)
      #   lightning                Bitcoin Lightning via LNbits
      #   eurc | eure | eurcv | evm   MiCA stablecoins on any EVM chain (Ethereum, Polygon, Base, Gnosis, Avalanche…)
      #   eurc-solana | eure-solana | sol | solana   Solana tokens
      #   monero                   Monero (XMR) — untraceable
      #   bitcoin                  Bitcoin on-chain
      - VOKTER_WALLET_ADAPTER=cashu
      # Cashu: point to any self-hosted or public Cashu mint
      #   Run your own: github.com/cashubtc/nutshell
      - VOKTER_CASHU_MINT_URL=
      # Daily spending limit in the adapter's native unit (0 = no limit)
      - VOKTER_WALLET_SPEND_LIMIT=0
      # Lightning (LNbits — self-hosted, never cloud)
      - VOKTER_LNBITS_URL=
      - VOKTER_LNBITS_INVOICE_KEY=
      - VOKTER_LNBITS_ADMIN_KEY=
      # EVM — works for ANY EVM chain (Ethereum, Polygon, Base, Gnosis, Avalanche…)
      # VOKTER_EVM_CHAIN is a label only; the actual chain is determined by the RPC URL.
      # Contract addresses: see wallet/adapters/evm.py for known EURC/EURe/EURCV addresses.
      - VOKTER_EVM_RPC_URL=
      - VOKTER_EVM_PRIVATE_KEY=
      - VOKTER_EVM_TOKEN_CONTRACT=
      - VOKTER_EVM_TOKEN_SYMBOL=
      - VOKTER_EVM_TOKEN_DECIMALS=18
      - VOKTER_EVM_CHAIN=ethereum
      # Solana — native SOL or any SPL token (EURC, EURe, future EU bank stablecoins)
      # Mint addresses: see wallet/adapters/solana.py for known SPL mints.
      - VOKTER_SOLANA_RPC_URL=
      - VOKTER_SOLANA_PRIVATE_KEY=
      - VOKTER_SOLANA_TOKEN_MINT=
      - VOKTER_SOLANA_TOKEN_SYMBOL=
      # Monero (run monero-wallet-rpc alongside this stack)
      - VOKTER_MONERO_RPC_URL=
      # Bitcoin (requires Bitcoin Core or Electrum daemon)
      - VOKTER_BTC_RPC_URL=
      - VOKTER_BTC_RPC_USER=
      - VOKTER_BTC_RPC_PASS=
    depends_on:
      - ollama

volumes:
  vokter_models:
  vokter_data:
